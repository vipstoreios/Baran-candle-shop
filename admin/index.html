<!doctype html>
<html lang="ku" dir="rtl">

  <title>Baran Candle Shop — Admin</title>

<body>
  <script>
    // GitHub Pages /admin route: load the real admin entry without redirect loops.
    fetch('../admin.html').then(r => r.text()).then(html => {
      document.open();
      document.write(html);
      document.close();
    }).catch(() => {
      window.location.href = '../admin.html';
    });
  </script>
