<!doctype html><html lang="ku" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baran — Checkout</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="glass.css"><style>body{background:#f5eee4}.checkout-page{max-width:1000px;margin:auto;padding:40px 20px}.checkout-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.checkout-head h1{font:400 42px Amiri;margin:0}.checkout-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.checkout-card{background:#fff9;border:1px solid #d9cbb9;border-radius:22px;padding:24px;backdrop-filter:blur(18px)}.checkout-card h2{font:400 27px Amiri;margin:0 0 18px}.form{display:grid;gap:12px}.form input,.form textarea,.form select{width:100%;padding:13px;border:1px solid #d9cbb9;background:#fff;color:#29241f;font:inherit}.form textarea{min-height:90px}.summary-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eadfd2;font-size:13px}.summary-total{display:flex;justify-content:space-between;padding-top:18px;font-weight:700}.btn{border:0;background:#29241f;color:#fff;padding:14px 20px;cursor:pointer}.success{display:none;text-align:center;padding:30px}.success.show{display:block}.success h2{font:400 35px Amiri}@media(max-width:700px){.checkout-grid{grid-template-columns:1fr}.checkout-head{align-items:flex-start;gap:15px;flex-direction:column}}</style></head><body><main class="checkout-page"><div class="checkout-head"><a class="brand" href="index.html"><span>BARAN</span><small>CANDLE ATELIER</small></a><a href="index.html#shop">← Back to shop</a></div><div id="checkoutApp" class="checkout-grid"><section class="checkout-card"><h1 data-title>Checkout</h1><form id="orderForm" class="form"><input name="name" required placeholder="Full name"><input name="phone" required placeholder="Phone number"><input name="email" type="email" placeholder="Email"><input name="city" required placeholder="City"><input name="address" required placeholder="Delivery address"><textarea name="note" placeholder="Order note"></textarea><button class="btn" type="submit">Confirm order</button></form></section><aside class="checkout-card"><h2>Order summary</h2><div id="summary"></div><div class="summary-total"><span>Total</span><strong id="total">$0.00</strong></div></aside></div><section id="success" class="checkout-card success"><h2>Thank you for your order.</h2><p>Your request has been received. We will contact you to confirm the details and arrange delivery.</p><a class="btn" href="index.html">Back to shop</a></section></main><script>const products=[{id:1,n:{badini:'Shîrîn Vanilla',sorani:'ڤانیلا شیرین',arabic:'فانيلا حلوة',english:'Sweet Vanilla'},p:24},{id:2,n:{badini:'Amber Oud',sorani:'عودی ئەمبەر',arabic:'عود وعنبر',english:'Amber Oud'},p:29},{id:3,n:{badini:'Ivory Pillar',sorani:'ستونی ئیڤۆری',arabic:'شمعة عاجية',english:'Ivory Pillar'},p:21},{id:4,n:{badini:'Rose Atelier',sorani:'ئەتلیەی گوڵ',arabic:'وردة فاخرة',english:'Rose Atelier'},p:26},{id:5,n:{badini:'Golden Duo',sorani:'دووانەی زێڕین',arabic:'ثنائي ذهبي',english:'Golden Duo'},p:42},{id:6,n:{badini:'Sandstone',sorani:'بەردی خۆڵەمێشی',arabic:'حجر رملي',english:'Sandstone'},p:27},{id:7,n:{badini:'Fig & Cedar',sorani:'هەنجیر و سەدر',arabic:'تين وأرز',english:'Fig & Cedar'},p:25},{id:8,n:{badini:'Baran Gift Box',sorani:'بۆکسێکی دیاری باران',arabic:'صندوق هدايا باران',english:'Baran Gift Box'},p:55}];let lang=localStorage.getItem('baran-language')||'badini';if(!['badini','sorani','arabic','english'].includes(lang))lang='badini';const cart=JSON.parse(localStorage.getItem('baran-cart')||'[]');const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));let total=0;document.documentElement.dir=lang==='english'?'ltr':'rtl';document.documentElement.lang=lang==='english'?'en':lang==='arabic'?'ar':'ku';document.querySelector('#summary').innerHTML=cart.map(i=>{const p=products.find(x=>x.id===i.id);if(!p)return'';total+=p.p*i.qty;return`<div class="summary-row"><span>${esc(p.n[lang])} × ${i.qty}</span><strong>$${(p.p*i.qty).toFixed(2)}</strong></div>`}).join('')||'<p>Your cart is empty.</p>';document.querySelector('#total').textContent='$'+total.toFixed(2);document.querySelector('#orderForm').addEventListener('submit',e=>{e.preventDefault();if(!cart.length)return;localStorage.removeItem('baran-cart');document.querySelector('#checkoutApp').style.display='none';document.querySelector('#success').classList.add('show')});</script></body></html>
